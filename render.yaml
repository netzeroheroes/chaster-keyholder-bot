# Free/paid web service on Render — standard Python host is enough (HTTPS included).
# Deploy: push repo → Render Dashboard → New → Blueprint
# Then in Chaster Developer → your extension:
#   Main page URL:   https://<this-service>.onrender.com/ext
#   Config page URL: https://<this-service>.onrender.com/ext/config
services:
  - type: web
    name: chaster-keyholder-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "gryphe/mythomax-l2-13b"
      - key: LLM_MAX_TOKENS
        value: "768"
      - key: CHASTER_ACCESS_TOKEN
        sync: false
      - key: CHASTER_EXTENSION_SLUG
        sync: false
      - key: CHASTER_LOCK_ID
        sync: false
      - key: CHASTER_WEBHOOK_USER
        value: "chaster-bot"
      - key: CHASTER_WEBHOOK_PASSWORD
        sync: false
      - key: CHASTER_WEBHOOK_REQUIRE_AUTH
        value: "false"
      - key: STANDALONE_UI_ENABLED
        value: "false"
      - key: EXTENSION_DEV_BYPASS
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: RAD_API_TOKEN
        sync: false
      - key: RAD_LOCKBOX_SYNC_ENABLED
        value: "true"
      - key: RAD_SYNC_HYGIENE
        value: "true"
      - key: RAD_SYNC_SESSION_LOCK
        value: "false"
      - key: RAD_MANUAL_ONLY
        value: "false"
      - key: RAD_TIMER_SYNC_SECONDS
        value: "60"
      - key: RAD_TARGET_USER_ID
        value: "0"
      - key: RAD_LOCK_SETTINGS_ID
        sync: false
      - key: RAD_KEYHOLDER_IDS
        value: ""
      - key: RAD_IS_TEST_LOCK
        value: "true"
