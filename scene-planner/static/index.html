<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Scenario Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/planner.css" />
</head>
<body>
  <div class="bg"></div>
  <section id="gate" class="gate">
    <div class="gate-card">
      <p class="eyebrow">Adults 18+ · OpenRouter</p>
      <h1>Scenario Planner</h1>
      <p class="lede">Extreme, step-by-step BDSM scene itineraries. For femdoms stuck for ideas.</p>
      <button type="button" class="btn primary" id="adultBtn">I am 18+ — open the planner</button>
    </div>
  </section>
  <div id="app" class="shell hidden">
    <header class="top">
      <div>
        <p class="eyebrow">BDSM Scenario Planner</p>
        <h1>Tell it what you have.</h1>
      </div>
      <div class="top-actions">
        <button type="button" class="btn ghost" id="copyBtn">Copy last scene</button>
        <button type="button" class="btn ghost" id="resetBtn">New scene</button>
      </div>
    </header>
    <p class="lede top-lede">Chat like the Miniapps planner: toys and hard limits first, then a unique itinerary. Follow-ups rewrite the whole night.</p>
    <div id="thread" class="thread" aria-live="polite"></div>
    <form id="composer" class="composer">
      <textarea id="prompt" rows="3" placeholder="flogger, paddle, cane, cuffs, collar…  Hard limits: none" required></textarea>
      <div class="composer-row">
        <p id="formStatus" class="status"></p>
        <button type="submit" class="btn primary" id="sendBtn">Send</button>
      </div>
    </form>
  </div>
  <script src="/static/planner.js"></script>
</body>
</html>
