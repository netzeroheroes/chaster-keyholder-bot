<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Keyholder chat</title>
  <link rel="stylesheet" href="/static/ext/ext.css?v=3" />
</head>
<body>
  <div id="gate" class="gate">
    <p class="title">Chaster only</p>
    <p id="gateMsg">Open this from your lock / keyholder extension tab in Chaster.</p>
  </div>

  <div id="app" class="app hidden">
    <header class="top">
      <div>
        <p class="eyebrow" id="roleLabel">—</p>
        <h1 id="heading">Chat</h1>
      </div>
      <p class="meta" id="sessionMeta"></p>
    </header>
    <nav id="roomTabs" class="room-tabs" aria-label="Chat rooms">
      <button type="button" class="room-tab active" data-room="group">Group</button>
      <button type="button" class="room-tab hidden" data-room="private" id="privateTab">
        Private
      </button>
    </nav>
    <p id="roomHint" class="room-hint">Group: Domme + Sub + AI</p>

    <div class="chat-body">
      <div class="messages-wrap">
        <div id="messages" class="messages"></div>
        <button type="button" id="jumpLatest" class="jump-latest hidden">↓ New messages</button>
      </div>
      <div class="composer-dock">
        <form id="chatForm" class="composer">
          <textarea id="input" rows="1" placeholder="Message…"></textarea>
          <button type="submit" class="btn" id="sendBtn">Send</button>
        </form>
        <p id="status" class="status"></p>
      </div>
    </div>
  </div>

  <script src="/static/ext/ext.js?v=3"></script>
</body>
</html>
